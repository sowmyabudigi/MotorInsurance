<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device View · Motor Insurance Desk</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* =====================================================================
   Device View — responsive preview shell for motor-insurance-desk.html
   Self-contained: needs only the app files sitting next to it.
   ===================================================================== */
:root{--blue:#1d5eff;--blue2:#4f8bff;--ink:#0f1b3d;--ink2:#51608a;--line:#e5ebf7;--bg:#eef3fc;--ease:cubic-bezier(.22,.8,.3,1)}

/* base + invisible scrollbars (same preference as the app) */
*,*::before,*::after{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
html{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;font-family:"Plus Jakarta Sans","Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit}
img{display:block}

/* ---------- top toolbar ---------- */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 18px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;white-space:nowrap}
.brand img{width:34px;height:34px;object-fit:contain}
.brand em{font-style:normal;font-weight:600;color:var(--ink2);font-size:12.5px}
.views{display:flex;gap:8px;flex-wrap:wrap;margin:0 auto}
.utils{display:flex;gap:8px;align-items:center}

.vbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s,background .25s,color .25s}
.vbtn svg{width:16px;height:16px;flex:none}
.vbtn small{font-weight:600;font-size:11px;color:var(--ink2)}
.vbtn:hover{transform:translateY(-2px);border-color:var(--blue2);box-shadow:0 8px 18px rgba(29,94,255,.15)}
.vbtn:active{transform:scale(.97)}
.vbtn.is-active{background:linear-gradient(135deg,#1d5eff,#4a8bff);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(29,94,255,.35)}
.vbtn.is-active small{color:#d9e4ff}

.ubtn{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap;transition:transform .25s var(--ease),color .25s,border-color .25s,background .25s}
.ubtn svg{width:15px;height:15px;flex:none}
.ubtn:hover{color:var(--blue);border-color:var(--blue2);transform:translateY(-2px)}
.ubtn:active{transform:scale(.96)}
.ubtn.is-on{background:#eef4ff;color:var(--blue);border-color:#bfd3ff}
.ubtn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;color:var(--ink2);border-color:var(--line);background:#fff}

/* ---------- stage (scrollable preview area) ---------- */
.stage{flex:1;min-height:0;display:flex;overflow:auto;padding:26px;
  background:radial-gradient(rgba(29,94,255,.10) 1.4px,transparent 1.5px) 0 0/24px 24px,
             radial-gradient(1000px 420px at 90% -10%,#dbe7ff,transparent),
             radial-gradient(800px 420px at -10% 110%,#e3ecff,transparent),var(--bg)}
.stage.is-full{padding:0}

/* the wrapper is sized to the SCALED device; margin:auto centres safely
   (collapses to 0 when the device is bigger, so scrolling still works) */
.device{flex:none;margin:auto;position:relative;transition:width .35s var(--ease),height .35s var(--ease)}
.device.no-anim,.device.no-anim .bezel{transition:none!important}

/* device bezel — sized to the iframe, scaled from the top-left corner */
.bezel{position:relative;width:max-content;padding:14px;border-radius:30px;
  background:linear-gradient(160deg,#16285a,#0a1a44);
  box-shadow:0 30px 70px rgba(10,26,68,.35),inset 0 0 0 2px rgba(255,255,255,.07);
  transform-origin:top left;transition:transform .35s var(--ease)}
.bezel iframe{display:block;width:100%;height:100%;border:0;background:#fff;border-radius:18px}
.base{display:none}

/* device skins */
.device[data-device="mobile"] .bezel{padding:22px 12px 12px}
.device[data-device="mobile"] .bezel::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:56px;height:12px;border-radius:999px;background:#050f2c;box-shadow:inset 0 1px 3px rgba(255,255,255,.18)}
.device[data-device="tablet"] .bezel{padding:20px 14px 14px}
.device[data-device="tablet"] .bezel::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#050f2c;box-shadow:inset 0 0 3px rgba(255,255,255,.25)}
.device[data-device="laptop"] .bezel{padding:12px 12px 0;border-radius:18px 18px 0 0}
.device[data-device="laptop"] .bezel iframe{border-radius:8px 8px 0 0}
.device[data-device="laptop"] .base{display:block;height:15px;margin:0 -28px;background:linear-gradient(180deg,#31507f,#16294f);border-radius:0 0 14px 14px;position:relative}
.device[data-device="laptop"] .base::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:96px;height:5px;border-radius:0 0 8px 8px;background:#0b1c42}
.device[data-device="big"] .bezel{padding:12px;border-radius:16px}
.device[data-device="big"] .bezel iframe{border-radius:8px}
.device[data-device="big"] .bezel::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:rgba(126,224,255,.65);box-shadow:0 0 8px rgba(126,224,255,.8)}

/* full-screen mode: bezel disappears, app fills the window */
.device.is-full{width:100%!important;height:100%!important}
.device.is-full .bezel{width:100%!important;height:100%!important;padding:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;transform:none!important}
.device.is-full .bezel iframe{border-radius:0}
.device.is-full .base{display:none!important}

/* ---------- status bar ---------- */
.status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:9px 18px;background:#fff;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2)}
.status b{color:var(--ink);font-weight:800}
.status__live{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#16b364;animation:live 1.8s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(22,179,100,.5)}100%{box-shadow:0 0 0 9px rgba(22,179,100,0)}}
.status__zoom{font-weight:800;color:var(--blue)}
.status__keys{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
kbd{font:inherit;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line);background:#f5f8ff;color:var(--ink)}

/* ---------- responsive toolbar itself ---------- */
@media (max-width:980px){.status__keys{display:none}.brand em{display:none}}
@media (max-width:760px){
  .bar{padding:10px 12px;gap:10px}
  .views{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;margin:0;padding-bottom:2px}
  .vbtn{flex:0 0 auto}
  .ubtn span{display:none}
  .stage{padding:14px}
}
@media (max-width:520px){.vbtn small{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<noscript><div style="padding:16px;font-family:sans-serif;color:#b42318;font-weight:700">This preview tool needs JavaScript enabled.</div></noscript>

<header class="bar">
  <div class="brand"><img src="images/logo.png" alt=""><span>Device View<em>· Motor Insurance Desk</em></span></div>

  <nav class="views" aria-label="Preview views">
    <button class="vbtn" type="button" data-view="mobile" aria-label="Mobile view, 390 by 844">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/></svg>
      Mobile <small>390×844</small>
    </button>
    <button class="vbtn" type="button" data-view="tablet" aria-label="Tablet view, 834 by 1112">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><circle cx="12" cy="18.2" r="1" fill="currentColor" stroke="none"/></svg>
      Tablet <small>834×1112</small>
    </button>
    <button class="vbtn" type="button" data-view="laptop" aria-label="Laptop view, 1366 by 768">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="10.5" rx="1.8"/><path d="M2.5 19.5h19l-1.7-3.4H4.2z"/></svg>
      Laptop <small>1366×768</small>
    </button>
    <button class="vbtn" type="button" data-view="big" aria-label="Big screen view, 1920 by 1080">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M9 20.5h6M12 16.5v4"/></svg>
      Big screen <small>1920×1080</small>
    </button>
    <button class="vbtn" type="button" data-view="full" aria-label="Full screen view, fills the window">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      Full screen <small>window</small>
    </button>
  </nav>

  <div class="utils">
    <button class="ubtn" type="button" id="u-rotate" title="Rotate portrait / landscape (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span>Rotate</span>
    </button>
    <button class="ubtn is-on" type="button" id="u-fit" title="Zoom to fit (F)" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"/></svg><span>Fit</span>
    </button>
    <button class="ubtn" type="button" id="u-reload" title="Reload the app inside the frame">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg><span>Reload</span>
    </button>
    <button class="ubtn" type="button" id="u-open" title="Open the app in a new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg><span>Open</span>
    </button>
    <button class="ubtn" type="button" id="u-fs" title="Browser fullscreen (Esc to exit)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span>Fullscreen</span>
    </button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="device" id="device" data-device="full">
    <div class="bezel" id="bezel">
      <!-- If your app file has a different name, change ONLY this src -->
      <iframe id="frame" src="motor-insurance-desk.html" title="Motor Insurance Desk preview"></iframe>
      <div class="base" aria-hidden="true"></div>
    </div>
  </div>
</main>

<footer class="status">
  <span class="status__live"><span class="dot" aria-hidden="true"></span>Live preview</span>
  <span id="status-view">Full screen</span>
  <span id="status-zoom" class="status__zoom">100%</span>
  <span class="status__keys">Shortcuts:&nbsp;<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd><kbd>5</kbd> views&nbsp;·&nbsp;<kbd>R</kbd> rotate&nbsp;·&nbsp;<kbd>F</kbd> fit</span>
</footer>

<script>
(function () {
  'use strict';

  var frame    = document.getElementById('frame');
  var stage    = document.getElementById('stage');
  var device   = document.getElementById('device');
  var bezel    = document.getElementById('bezel');
  var viewText = document.getElementById('status-view');
  var zoomText = document.getElementById('status-zoom');
  var uRotate  = document.getElementById('u-rotate');
  var uFit     = document.getElementById('u-fit');
  var APP      = frame.getAttribute('src');   /* follows the iframe src above */

  /* ---------- view presets ---------- */
  var DEVICES = {
    mobile: { label: 'Mobile',     w: 390,  h: 844  },
    tablet: { label: 'Tablet',     w: 834,  h: 1112 },
    laptop: { label: 'Laptop',     w: 1366, h: 768  },
    big:    { label: 'Big screen', w: 1920, h: 1080 }
  };
  var ORDER = ['mobile', 'tablet', 'laptop', 'big', 'full'];
  var current = 'full', rotated = false, fitOn = true;

  /* deep-link: device-view.html#mobile / #tablet / ... */
  var start = (location.hash || '').slice(1);
  if (ORDER.indexOf(start) >= 0) current = start;

  /* ---------- core: size the frame, compute the fit scale ---------- */
  function apply() {
    var isFull = current === 'full';
    device.setAttribute('data-device', current);
    device.classList.toggle('is-full', isFull);
    stage.classList.toggle('is-full', isFull);
    uRotate.disabled = isFull;
    uFit.disabled = isFull;

    if (isFull) {
      frame.style.width = frame.style.height = '';
      device.style.width = device.style.height = '';
      bezel.style.transform = '';
      viewText.innerHTML = '<b>Full screen</b> · app fills this window';
      zoomText.textContent = '100%';
      return;
    }

    var d = DEVICES[current];
    var w = rotated ? d.h : d.w;
    var h = rotated ? d.w : d.h;
    frame.style.width  = w + 'px';     /* the app sees a real 390px viewport, */
    frame.style.height = h + 'px';     /* so its media queries respond live   */

    var bw = bezel.offsetWidth, bh = bezel.offsetHeight, s = 1;
    if (fitOn) {
      var cs = getComputedStyle(stage);
      var availW = stage.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var availH = stage.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom);
      if (availW > 40 && availH > 40) s = Math.min(1, availW / bw, availH / bh);
    }
    bezel.style.transform = 'scale(' + s + ')';
    device.style.width  = Math.round(bw * s) + 'px';   /* wrapper = visual size, */
    device.style.height = Math.round(bh * s) + 'px';   /* so centring stays true */

    viewText.innerHTML = '<b>' + d.label + '</b> · ' + w + ' × ' + h + ' · ' + (rotated ? 'landscape' : 'portrait');
    zoomText.textContent = Math.round(s * 100) + '%' + (fitOn ? ' · fit on' : ' · actual size');
  }

  /* recompute without animation (window resizes, fullscreen changes) */
  function applyQuick() {
    device.classList.add('no-anim');
    apply();
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { device.classList.remove('no-anim'); });
    });
  }

  function selectView(v) {
    current = v;
    Array.prototype.forEach.call(document.querySelectorAll('.vbtn'), function (b) {
      b.classList.toggle('is-active', b.getAttribute('data-view') === v);
    });
    try { history.replaceState(null, '', '#' + v); } catch (e) {}
    apply();
  }

  /* ---------- wiring ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.vbtn'), function (b) {
    b.addEventListener('click', function () { selectView(b.getAttribute('data-view')); });
  });

  uRotate.addEventListener('click', function () { rotated = !rotated; apply(); });

  uFit.addEventListener('click', function () {
    fitOn = !fitOn;
    uFit.classList.toggle('is-on', fitOn);
    uFit.setAttribute('aria-pressed', String(fitOn));
    apply();
  });

  document.getElementById('u-reload').addEventListener('click', function () {
    try { frame.contentWindow.location.reload(); }
    catch (e) { frame.src = APP + (APP.indexOf('?') > -1 ? '&' : '?') + 'r=' + Date.now(); }
  });

  document.getElementById('u-open').addEventListener('click', function () {
    window.open(APP, '_blank');
  });

  document.getElementById('u-fs').addEventListener('click', function () {
    try {
      var el = document.fullscreenElement || document.webkitFullscreenElement;
      if (el) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
      else {
        var d = document.documentElement;
        var r = d.requestFullscreen || d.webkitRequestFullscreen;
        if (r) r.call(d);
      }
    } catch (e) {}
  });

  /* keyboard: 1-5 views, R rotate, F fit (works when focus is outside the app frame) */
  document.addEventListener('keydown', function (e) {
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k >= '1' && k <= '5') selectView(ORDER[+k - 1]);
    else if (k === 'r' || k === 'R') { if (current !== 'full') { rotated = !rotated; apply(); } }
    else if (k === 'f' || k === 'F') uFit.click();
  });

  window.addEventListener('resize', applyQuick);
  document.addEventListener('fullscreenchange', applyQuick);
  document.addEventListener('webkitfullscreenchange', applyQuick);

  /* ---------- init ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.vbtn'), function (b) {
    b.classList.toggle('is-active', b.getAttribute('data-view') === current);
  });
  apply();
})();
</script>
</body>
</html>
